services:
  mongodb:
    image: mongo:latest
    container_name: lab_asset_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - lab_asset_network

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: lab_asset_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/lab_asset
      JWT_SECRET: change-this-secret
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://127.0.0.1:8000
      ADMIN_CONTACT: admin.lab@kampus.ac.id
    depends_on:
      - mongodb
    networks:
      - lab_asset_network
    volumes:
      - ./backend-node:/app
      - /app/node_modules

  frontend-laravel:
    build:
      context: ./frontend-laravel
      dockerfile: Dockerfile
    container_name: lab_asset_frontend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Lab Asset
      APP_ENV: local
      APP_KEY: base64:vtKoOwt1Ctlql4RrZDHw5VqVkToslG1Fo44Lc1ApzA0=
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      BACKEND_API_URL: http://backend-node:5000/api
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      - backend-node
    networks:
      - lab_asset_network
    volumes:
      - ./frontend-laravel:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  mongodb_data:

networks:
  lab_asset_network:
    driver: bridge
